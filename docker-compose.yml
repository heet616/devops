version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - health_network
    depends_on:
      - ingestion-service

  ingestion-service:
    build:
      context: ./ingestion_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sqlite_storage:/data
    environment:
      - ANALYSIS_URL=http://analysis-service:8002
      - DB_PATH=/data/healthtech.db
    networks:
      - health_network
    deploy:
      resources:
        limits:
          memory: 256M

  analysis-service:
    build:
      context: ./analysis_service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    networks:
      - health_network
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    ports:
      - "9090:9090"
    networks:
      - health_network

  grafana:
    build: 
      context: .
      dockerfile: Dockerfile.grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      # ONLY keep this one. It saves users/passwords.
      - grafana_storage:/var/lib/grafana
      # If you have datasources, you should bake them into the Dockerfile too, but keep this if you must:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    networks:
      - health_network

  dashboard-service:
    build:
      context: ./dashboard_service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=dashboard_service
      - PYTHONUNBUFFERED=1
    networks:
      - health_network
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  sqlite_storage:
    driver: local
  grafana_storage:
    driver: local

networks:
  health_network:
    driver: bridge
