version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    privileged: true
    user: root
    container_name: jenkins-master
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/lib/jenkins            # Persists your jobs and plugins
      - /var/run/docker.sock:/var/run/docker.sock # Allows Jenkins to control Docker
      - /usr/bin/docker:/usr/bin/docker           # Maps the docker command
    networks:
      - health_network

networks:
  health_network:
    driver: bridge

volumes:
  jenkins_data:  # THIS IS THE MISSING PIECE